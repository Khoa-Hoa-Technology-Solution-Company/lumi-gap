server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Six private evidence files at up to 10 MiB each, plus multipart metadata.
  # Per-route file type/count/size limits remain enforced by the API.
  client_max_body_size 61m;

  # PDF.js uses a local ES-module worker. Never return the SPA HTML for a
  # missing module, and serve the strict JavaScript MIME expected by browsers.
  location ~ ^/assets/.*\.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }

  # Keep the browser on one origin in the local Compose stack. This avoids
  # CORS surprises and lets Vite use the relative /api/v1 build-time base URL.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 180s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
