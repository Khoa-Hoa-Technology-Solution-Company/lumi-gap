# Single Ubuntu VPS override (Azure VM, Hetzner Cloud, or any Docker host).
#
# Use together with the root compose file, from the repository root:
#   docker compose -f docker-compose.yml -f deploy/vps/docker-compose.vps.yml up -d --build
# (deploy/vps/deploy.sh does exactly this.)
#
# What it changes compared to the local stack:
# - Only Caddy publishes ports (80/443). Postgres, Redis, backend, web and
#   ai-reviewer are reachable only inside the Docker network.
# - Caddy obtains Let's Encrypt certificates for LUMIGAP_DOMAIN and API_DOMAIN.
# - The API and every worker run the compiled JavaScript with plain `node`
#   instead of `pnpm` + `tsx`, which saves roughly 100-150 MB of RAM per process.
# - Backend and workers use the public HTTPS origins (CORS, e-mail links, Google callback).
# - Postgres memory is sized by PG_* variables (defaults fit an 8 GB machine).
# LibreTranslate stays off (profile "translation"); keep TRANSLATION_PROVIDER=gemini.
#
# Automatic paper crawling: worker-sync runs the daily topic-watch job on
# SYNC_CRON (UTC), then worker-embedding (EMBED_CRON) and worker-paper-analysis
# (PAPER_ANALYSIS_CRON) process the new papers. It only follows the catalogue
# entries an admin marked "Follow daily" (see docs/DEPLOY_AZURE.md, step 6).

# The root file sets CORS_ORIGIN and GOOGLE_CALLBACK_URL to localhost in
# `environment`, which wins over .env. The first CORS_ORIGIN entry is also the
# origin used in e-mail links (invitations, verification), so the backend and
# every worker get the public HTTPS values.
x-public-urls: &public-urls
  CORS_ORIGIN: https://${LUMIGAP_DOMAIN:?Set LUMIGAP_DOMAIN in .env}
  GOOGLE_CALLBACK_URL: https://${API_DOMAIN:?Set API_DOMAIN in .env}/api/v1/auth/google/callback

# Same working directory as `pnpm --filter backend ...`, so relative paths
# (uploads) resolve exactly as before.
x-node-worker: &node-worker
  working_dir: /app/apps/backend
  environment: *public-urls
  mem_limit: ${WORKER_MEM_LIMIT:-512m}

services:
  postgres:
    ports: !reset []
    shm_size: ${PG_SHM_SIZE:-1g}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - max_connections=150
    mem_limit: ${PG_MEM_LIMIT:-2g}

  redis:
    ports: !reset []
    mem_limit: 512m

  backend:
    ports: !reset []
    working_dir: /app/apps/backend
    command: ["node", "dist/server.js"]
    environment: *public-urls
    mem_limit: 1g

  web:
    ports: !reset []
    build:
      args:
        # Same-origin API: Caddy routes /api/* on LUMIGAP_DOMAIN to the backend.
        VITE_API_BASE: /api/v1
    mem_limit: 128m

  ai-reviewer:
    ports: !reset []
    mem_limit: 768m

  # --- Automatic crawling pipeline: keep these running. ---
  worker-sync:
    <<: *node-worker
    command: ["node", "dist/workers/sync.worker.js"]

  worker-embedding:
    <<: *node-worker
    command: ["node", "dist/workers/embedding.worker.js"]

  worker-paper-analysis:
    <<: *node-worker
    command: ["node", "dist/workers/paper-analysis.worker.js"]

  worker-tagging:
    <<: *node-worker
    command: ["node", "dist/workers/tagging.worker.js"]

  # --- User-facing AI features and notifications. ---
  worker-report:
    <<: *node-worker
    command: ["node", "dist/workers/report.worker.js"]

  worker-gaps:
    <<: *node-worker
    command: ["node", "dist/workers/gaps.worker.js"]

  worker-ai-jobs:
    <<: *node-worker
    command: ["node", "dist/workers/ai-jobs.worker.js"]

  worker-notifications:
    <<: *node-worker
    command: ["node", "dist/workers/notification.worker.js"]

  worker-community-summary:
    <<: *node-worker
    command: ["node", "dist/workers/community-summary.worker.js"]

  # --- Admin-started jobs (campaigns, backfill, validation). Safe to stop on a 4 GB machine. ---
  worker-topic-backfill:
    <<: *node-worker
    command: ["node", "dist/workers/topic-backfill.worker.js"]

  worker-corpus-validation:
    <<: *node-worker
    command: ["node", "dist/workers/corpus-validation.worker.js"]

  worker-openalex-ingest:
    <<: *node-worker
    command: ["node", "dist/workers/openalex-ingest.worker.js"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LUMIGAP_DOMAIN: ${LUMIGAP_DOMAIN:?Set LUMIGAP_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_started
      backend:
        condition: service_healthy
    mem_limit: 128m

volumes:
  caddy-data:
  caddy-config:
