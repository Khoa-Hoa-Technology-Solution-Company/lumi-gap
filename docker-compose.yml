name: lumi-gap

# Local production-style stack. Copy .env.example to .env and set GEMINI_API_KEY,
# or run pnpm setup. Workers start by default; seed/translation/ingest are opt-in.

x-backend-common: &backend-common
  image: lumigap-backend:local
  pull_policy: never
  env_file: .env
  environment: &backend-environment
    NODE_ENV: production
    PORT: 4000
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    PERSISTENCE_PROVIDER: postgresql
    REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
    LIBRETRANSLATE_URL: http://libretranslate:5000
    AI_REVIEWER_URL: http://ai-reviewer:8001
    INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
    JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
    JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
    CORS_ORIGIN: http://localhost:${WEB_PORT:-8080},http://localhost:3000
    GOOGLE_CALLBACK_URL: http://localhost:${API_PORT:-4000}/api/v1/auth/google/callback
  depends_on: &backend-dependencies
    migrate:
      condition: service_completed_successfully
    jwt-keys:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  restart: unless-stopped
  volumes:
    - jwt-keys:/run/secrets:ro
    - backend-uploads:/app/apps/backend/uploads

services:
  # PostgreSQL + pgvector is the default application persistence layer.
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    ports:
      # PostgreSQL installed directly on Windows commonly owns 5432. LumiGap
      # uses 5433 on the host while keeping the standard port inside Docker.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -qx PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Free, self-hosted title/abstract translation for Paper Detail only.
  # Enable with: docker compose --profile translation up --build
  libretranslate-init:
    image: libretranslate/libretranslate:v1.9.6
    profiles: ["translation"]
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /home/libretranslate/.local/share /home/libretranslate/.local/cache
        && chown -R 1032:1032 /home/libretranslate/.local
    volumes:
      - libretranslate-share:/home/libretranslate/.local/share
      - libretranslate-cache:/home/libretranslate/.local/cache

  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    profiles: ["translation"]
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: ${LIBRETRANSLATE_LOAD_ONLY:-en,vi,es,fr,de,pt,zh,ja,ko,ru,id}
    volumes:
      - libretranslate-share:/home/libretranslate/.local/share
      - libretranslate-cache:/home/libretranslate/.local/cache
    depends_on:
      libretranslate-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 120s

  # One-shot initialization. Missing/invalid keys or failed migrations block API/workers.
  jwt-keys:
    image: lumigap-backend:local
    pull_policy: never
    command: ["node", "scripts/jwt-keys.mjs"]
    volumes:
      - jwt-keys:/run/secrets
    restart: "no"

  migrate:
    <<: *backend-common
    command: ["pnpm", "--filter", "backend", "db:migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes: []
    restart: "no"

  seed:
    <<: *backend-common
    profiles: ["seed"]
    environment:
      <<: *backend-environment
      NODE_ENV: development
    command: ["pnpm", "--filter", "backend", "db:seed"]
    restart: "no"

  backend:
    <<: *backend-common
    # Build this shared image once; workers and one-shot services reuse it.
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - backend-uploads:/app/apps/backend/uploads
      - jwt-keys:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    image: lumigap-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  ai-reviewer:
    image: lumigap-ai-reviewer:local
    build:
      context: ./apps/ai-reviewer
      dockerfile: Dockerfile
    env_file: .env
    environment:
      REVIEW_APP_HOST: 0.0.0.0
      REVIEW_APP_PORT: 8001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      APP_ENV: development
      APP_BASE_URL: http://ai-reviewer:8001
    ports:
      - "8001:8001"
    volumes:
      - ai-reviewer-data:/app/data
      - shared-storage-uploads:/app/data/uploads
      - shared-storage-outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker-report:
    <<: *backend-common
    command: ["pnpm", "--filter", "backend", "worker:report"]

  worker-gaps:
    <<: *backend-common
    command: ["pnpm", "--filter", "backend", "worker:gaps"]

  worker-embedding:
    <<: *backend-common
    command: ["pnpm", "--filter", "backend", "worker:embedding"]

  worker-paper-analysis:
    <<: *backend-common
    command: ["pnpm", "--filter", "backend", "worker:paper-analysis"]
    volumes:
      - backend-uploads:/app/apps/backend/uploads:ro
      - jwt-keys:/run/secrets:ro
    depends_on:
      <<: *backend-dependencies
      ai-reviewer:
        condition: service_healthy

  worker-notifications:
    <<: *backend-common
    command: ["pnpm", "--filter", "backend", "worker:notifications"]

  worker-corpus-validation:
    <<: *backend-common
    command: ["pnpm", "--filter", "backend", "worker:corpus-validation"]

  worker-community-summary:
    <<: *backend-common
    command: ["pnpm", "--filter", "backend", "worker:community-summary"]

  # The campaign is explicit and needs OPENALEX_API_KEY. It never starts a
  # campaign by itself; an admin must first plan and start one through the API.
  worker-openalex-ingest:
    <<: *backend-common
    profiles: ["ingest"]
    command: ["pnpm", "--filter", "backend", "worker:openalex-ingest"]

volumes:
  jwt-keys:
  postgres-data:
  redis-data:
  libretranslate-share:
  libretranslate-cache:
  backend-uploads:
  ai-reviewer-data:
  shared-storage-uploads:
  shared-storage-outputs:
