name: lumi-gap

# Local/demo runtime for the whole web platform. Copy .env.compose.example to
# .env.compose and replace every placeholder before starting it.
#
# This file intentionally keeps heavyweight workers behind Compose profiles:
#   docker compose up --build
#   docker compose --profile workers up --build
#   docker compose --profile ingest up --build
#
# PostgreSQL + pgvector is the only application persistence layer.

x-backend-common: &backend-common
  image: liemresearch-backend:local
  build:
    context: .
    dockerfile: Dockerfile.backend
  env_file:
    - .env.compose
    - .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_URI}@postgres:5432/${POSTGRES_DB}
    PERSISTENCE_PROVIDER: postgresql
    REDIS_URL: redis://default:${REDIS_PASSWORD_URI}@redis:6379
    LIBRETRANSLATE_URL: http://libretranslate:5000
    AI_REVIEWER_URL: http://ai-reviewer:8001
    INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env.compose}
    CORS_ORIGIN: http://localhost:8080,http://localhost:5173
    GOOGLE_CALLBACK_URL: http://localhost:4000/api/v1/auth/google/callback
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  volumes:
    - ./apps/backend/.keys:/run/secrets:ro

services:
  # PostgreSQL + pgvector is the default application persistence layer.
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    ports:
      # PostgreSQL installed directly on Windows commonly owns 5432. LumiGap
      # uses 5433 on the host while keeping the standard port inside Docker.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.compose}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.compose}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.compose}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -qx PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Free, self-hosted title/abstract translation for Paper Detail only.
  # Enable with: docker compose --profile translation up --build
  libretranslate-init:
    image: libretranslate/libretranslate:v1.9.6
    profiles: ["translation"]
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /home/libretranslate/.local/share /home/libretranslate/.local/cache
        && chown -R 1032:1032 /home/libretranslate/.local
    volumes:
      - libretranslate-share:/home/libretranslate/.local/share
      - libretranslate-cache:/home/libretranslate/.local/cache

  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    profiles: ["translation"]
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: ${LIBRETRANSLATE_LOAD_ONLY:-en,vi,es,fr,de,pt,zh,ja,ko,ru,id}
    volumes:
      - libretranslate-share:/home/libretranslate/.local/share
      - libretranslate-cache:/home/libretranslate/.local/cache
    depends_on:
      libretranslate-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 120s

  backend:
    <<: *backend-common
    ports:
      - "4000:4000"
    volumes:
      - backend-uploads:/app/apps/backend/uploads
      - ./apps/backend/.keys:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    image: liemresearch-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  ai-reviewer:
    image: liemresearch-ai-reviewer:local
    build:
      context: ./apps/ai-reviewer
      dockerfile: Dockerfile
    env_file:
      - .env.compose
      - .env
    environment:
      REVIEW_APP_HOST: 0.0.0.0
      REVIEW_APP_PORT: 8001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env.compose}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      APP_ENV: development
      APP_BASE_URL: http://ai-reviewer:8001
    ports:
      - "8001:8001"
    volumes:
      - ai-reviewer-data:/app/data
      - shared-storage-uploads:/app/data/uploads
      - shared-storage-outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker-report:
    <<: *backend-common
    profiles: ["workers"]
    command: ["pnpm", "--filter", "backend", "worker:report"]

  worker-gaps:
    <<: *backend-common
    profiles: ["workers"]
    command: ["pnpm", "--filter", "backend", "worker:gaps"]

  worker-embedding:
    <<: *backend-common
    profiles: ["workers"]
    command: ["pnpm", "--filter", "backend", "worker:embedding"]

  worker-paper-analysis:
    <<: *backend-common
    profiles: ["workers"]
    command: ["pnpm", "--filter", "backend", "worker:paper-analysis"]

  worker-notifications:
    <<: *backend-common
    profiles: ["workers"]
    command: ["pnpm", "--filter", "backend", "worker:notifications"]

  worker-corpus-validation:
    <<: *backend-common
    profiles: ["workers"]
    command: ["pnpm", "--filter", "backend", "worker:corpus-validation"]

  # The campaign is explicit and needs OPENALEX_API_KEY. It never starts a
  # campaign by itself; an admin must first plan and start one through the API.
  worker-openalex-ingest:
    <<: *backend-common
    profiles: ["ingest"]
    command: ["pnpm", "--filter", "backend", "worker:openalex-ingest"]

volumes:
  postgres-data:
  redis-data:
  libretranslate-share:
  libretranslate-cache:
  backend-uploads:
  ai-reviewer-data:
  shared-storage-uploads:
  shared-storage-outputs:
